[project]
name = "deployer"
version = "0.1.0"
description = "The only door from office's agents to Docker"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
